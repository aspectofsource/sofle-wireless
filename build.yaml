---
# Mark's build: only his keymap (both halves) and the settings reset.
# TheKeebLab's original list is in git history if ever needed.
include:
  - board: nice_nano_v2
    shield: sofle_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DKEYMAP_FILE=@ZMK_CONFIG@/sofle-mark.keymap
    artifact-name: sofle-mark-left
  - board: nice_nano_v2
    shield: sofle_right
    cmake-args: -DKEYMAP_FILE=@ZMK_CONFIG@/sofle-mark.keymap
    artifact-name: sofle-mark-right
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: sofle-wireless-settings-reset
